<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevPortal</title>
    <link rel="stylesheet" href="Styles/index.css">
</head>

<body>

    <nav>
        <div class="logo">DevPortal</div>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Projects</a>
            <a href="#">Settings</a>
        </div>
    </nav>

    <main>

        <section class="profile-card">

            <div class="status"></div>

            <div class="profile-image">
                <img src="Assets/Images/Profile.jpeg" alt="Profile Picture">
            </div>

            <h1>Ibrahim Kteish</h1>
            <p class="job-title">Full-Stack Developer</p>

            <div class="profile-line"></div>

            <div class="stats">
                <div class="stat">
                    <strong>12</strong>
                    <span>Projects</span>
                </div>

                <div class="stat">
                    <strong>850</strong>
                    <span>Commits</span>
                </div>
            </div>

        </section>


        <section class="projects-card">

            <h2>Active Projects</h2>

            <div class="project">
                <div>
                    <h3>E-Commerce Redesign</h3>
                    <p>Updated 2 hours ago</p>
                </div>

                <span class="project-status">In Progress</span>
            </div>

            <div class="project">
                <div>
                    <h3>Portfolio Template</h3>
                    <p>Updated yesterday</p>
                </div>

                <span class="project-status">Completed</span>
            </div>

        </section>

    </main>

</body>
</html>
